name: 手机号登录
on:
  workflow_dispatch:
    inputs:
      phone:
        description: '手机号'
        required: true
      code:
        description: '验证码'
        required: true
      userid:
        description: '指定 userid（多账号时选择，可选）'
        required: false
      append_user:
        description: '追加账号'
        required: true
        type: choice
        options:
          - '是'
          - '否'
      print_userinfo:
        description: '是否在日志中输出登录信息'
        required: true
        type: choice
        options:
          - '是'
          - '否'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
      - name: 创建node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json
      - name: 🔧 检查GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi
          gh --version
      - name: Cache node_modules in api directory
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: 安装依赖
        run: cd api && npm ci --no-fund --no-audit
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      - name: 手机号登录
        run: npm run phoneLogin
        env:
          PHONE: ${{ github.event.inputs.phone }}
          CODE: ${{ github.event.inputs.code }}
          USERID: ${{ github.event.inputs.userid }}
          APPEND_USER: ${{ github.event.inputs.append_user }}
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          PRINT_USERINFO: ${{ github.event.inputs.print_userinfo }}
          GITHUB_REPOSITORY: ${{ github.repository }}
